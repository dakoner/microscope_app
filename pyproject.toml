[project]
name = "microscope-app"
version = "0.1.0"
description = "Python launcher for the C++ microscope Qt application"
requires-python = ">=3.11"
dependencies = [
    # The native extension is compiled against a Qt 6.11.2 MSVC kit on Windows,
    # so the Qt runtime coming from PySide6 has to match exactly.
    "PySide6==6.11.2; sys_platform == 'win32'",
    "PySide6>=6.6; sys_platform != 'win32'",
    "shiboken6>=6.6",
    "opencv-python>=4.9",
    "mcp>=1.26,<2",
    "pybind11>=2.11",
]

[project.scripts]
microscope-app = "run_microscope_app:main"
microscope-camera-server = "run_camera_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
